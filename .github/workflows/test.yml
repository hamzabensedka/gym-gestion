name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_gestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_gestion_test?schema=public
      SESSION_SECRET: test-session-secret-min-32-chars-long!!
      MEMBER_SESSION_SECRET: test-member-session-secret-min-32-chars!!
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ""
      EMAIL_FROM: "FitClub <noreply@test.local>"
      INVITE_TTL_HOURS: 72

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run test:db:reset

      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_gestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_gestion_test?schema=public
      SESSION_SECRET: test-session-secret-min-32-chars-long!!
      MEMBER_SESSION_SECRET: test-member-session-secret-min-32-chars!!
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ""
      EMAIL_FROM: "FitClub <noreply@test.local>"
      INVITE_TTL_HOURS: 72
      CI: true
      NEXT_PUBLIC_E2E_TEST: "true"
      PLAYWRIGHT_PORT: 3001
      PLAYWRIGHT_BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
